<svg xmlns="http://www.w3.org/2000/svg" width="660" height="690" viewBox="0 0 660 690" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#2c4a70"/>
    </marker>
    <style>
      .layer { fill: #f4f8fc; stroke: #2c4a70; stroke-width: 1.3; rx: 7; }
      .sub   { fill: #ffffff; stroke: #5b7fa6; stroke-width: 1.05; rx: 5; }
      .chip  { fill: #eef3f8; stroke: #7d99b8; stroke-width: 1; rx: 4; }
      .meta  { fill: #e7eef6; stroke: #5b7fa6; stroke-width: 1.05; rx: 4; }
      .lh { fill: #14243d; font-size: 12.5px; font-weight: bold; text-anchor: middle; }
      .sh { fill: #14243d; font-size: 10.5px; font-weight: bold; text-anchor: middle; }
      .p  { fill: #33455f; font-size: 9.6px; text-anchor: middle; }
      .c  { fill: #23364f; font-size: 8.4px; text-anchor: middle; }
      .i  { fill: #4a5a72; font-size: 8.8px; font-style: italic; text-anchor: middle; }
      .ln { stroke: #2c4a70; stroke-width: 1.3; fill: none; }
      .lbl { fill: #4a5a72; font-size: 8.8px; text-anchor: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="660" height="690" fill="#ffffff"/>

  <!-- LAYER 1 : PRESENTATION -->
  <rect class="layer" x="20" y="20" width="620" height="74"/>
  <text class="lh" x="330" y="39">Presentation Layer &#8212; React with Vite</text>
  <rect class="sub" x="40" y="48" width="188" height="34"/>
  <text class="p" x="134" y="63">Landing Page</text>
  <text class="i" x="134" y="76">project overview</text>
  <rect class="sub" x="238" y="48" width="184" height="34"/>
  <text class="p" x="330" y="63">Analysis Dashboard</text>
  <text class="i" x="330" y="76">upload, result, scan history</text>
  <rect class="sub" x="432" y="48" width="188" height="34"/>
  <text class="p" x="526" y="63">Research Page</text>
  <text class="i" x="526" y="76">methods and measured results</text>

  <line class="ln" x1="235" y1="94" x2="235" y2="114" marker-end="url(#b)"/>
  <text class="lbl" x="288" y="108">HTTP / JSON</text>

  <!-- LAYER 2 : GATEWAY -->
  <rect class="layer" x="20" y="114" width="430" height="74"/>
  <text class="lh" x="235" y="133">API Gateway &#8212; Express.js</text>
  <text class="p" x="235" y="152">Receives the upload, forwards it to the ML service,</text>
  <text class="p" x="235" y="166">and persists the returned scan record</text>
  <text class="i" x="235" y="180">single entry point for the browser</text>

  <!-- MongoDB beside gateway -->
  <line class="ln" x1="450" y1="151" x2="472" y2="151" marker-end="url(#b)"/>
  <rect class="layer" x="472" y="114" width="168" height="74"/>
  <text class="lh" x="556" y="137">MongoDB</text>
  <text class="p" x="556" y="155">Scan history: prediction,</text>
  <text class="p" x="556" y="169">confidence band, timestamp</text>

  <line class="ln" x1="235" y1="188" x2="235" y2="208" marker-end="url(#b)"/>
  <text class="lbl" x="292" y="202">multipart request</text>

  <!-- LAYER 3 : ML SERVICE -->
  <rect class="layer" x="20" y="208" width="620" height="342"/>
  <text class="lh" x="330" y="228">Machine Learning Inference Service &#8212; FastAPI</text>

  <!-- row A -->
  <rect class="sub" x="34" y="240" width="294" height="44"/>
  <text class="sh" x="181" y="257">Validation and Quality Gate</text>
  <text class="p" x="181" y="274">format checks, sharpness, contrast, resolution</text>
  <rect class="sub" x="346" y="240" width="280" height="44"/>
  <text class="sh" x="486" y="257">Model Cache</text>
  <text class="p" x="486" y="274">weights held resident across requests</text>

  <!-- row B : brain module -->
  <rect class="sub" x="34" y="296" width="294" height="104"/>
  <text class="sh" x="181" y="314">Brain MRI Module &#8212; four classes</text>
  <rect class="chip" x="48" y="324" width="62" height="28"/>
  <text class="c" x="79" y="336">EfficientNet</text><text class="c" x="79" y="346">B0</text>
  <rect class="chip" x="116" y="324" width="62" height="28"/>
  <text class="c" x="147" y="336">ResNet</text><text class="c" x="147" y="346">50</text>
  <rect class="chip" x="184" y="324" width="62" height="28"/>
  <text class="c" x="215" y="336">DenseNet</text><text class="c" x="215" y="346">121</text>
  <rect class="chip" x="252" y="324" width="62" height="28"/>
  <text class="c" x="283" y="336">VGG</text><text class="c" x="283" y="346">16</text>
  <text class="i" x="181" y="366">4 models &#215; 4 classes = 16 probability features</text>
  <rect class="meta" x="60" y="370" width="242" height="24"/>
  <text class="p" x="181" y="386">Logistic Regression Meta-Learner</text>

  <!-- row B : chest module -->
  <rect class="sub" x="346" y="296" width="280" height="104"/>
  <text class="sh" x="486" y="314">Chest X-ray Module &#8212; three classes</text>
  <rect class="chip" x="360" y="324" width="80" height="28"/>
  <text class="c" x="400" y="336">EfficientNet</text><text class="c" x="400" y="346">B0</text>
  <rect class="chip" x="446" y="324" width="80" height="28"/>
  <text class="c" x="486" y="336">ResNet</text><text class="c" x="486" y="346">50</text>
  <rect class="chip" x="532" y="324" width="80" height="28"/>
  <text class="c" x="572" y="336">DenseNet</text><text class="c" x="572" y="346">121</text>
  <text class="i" x="486" y="366">3 models &#215; 3 classes = 9 probability features</text>
  <rect class="meta" x="366" y="370" width="240" height="24"/>
  <text class="p" x="486" y="386">Logistic Regression Meta-Learner</text>

  <!-- row C -->
  <rect class="sub" x="34" y="412" width="190" height="66"/>
  <text class="sh" x="129" y="430">Uncertainty Layer</text>
  <text class="p" x="129" y="446">Temperature scaling</text>
  <text class="p" x="129" y="459">Split conformal prediction</text>
  <text class="p" x="129" y="472">Divergence screening</text>

  <rect class="sub" x="236" y="412" width="170" height="66"/>
  <text class="sh" x="321" y="430">Explainability</text>
  <text class="p" x="321" y="448">Grad-CAM heatmap from</text>
  <text class="p" x="321" y="461">an agreeing base model</text>

  <rect class="sub" x="418" y="412" width="208" height="66"/>
  <text class="sh" x="522" y="430">Evidence Layer</text>
  <text class="p" x="522" y="448">Embedding retrieval over the</text>
  <text class="p" x="522" y="461">curated corpus, cited by source</text>

  <!-- row D -->
  <rect class="sub" x="34" y="490" width="592" height="44"/>
  <text class="sh" x="330" y="508">Report Assembly</text>
  <text class="p" x="330" y="525">JSON response for the interface, and a paginated PDF document</text>

  <line class="ln" x1="330" y1="550" x2="330" y2="570" marker-end="url(#b)"/>
  <text class="lbl" x="386" y="564">reads at startup</text>

  <!-- LAYER 4 : ARTEFACTS -->
  <rect class="layer" x="20" y="570" width="620" height="100"/>
  <text class="lh" x="330" y="590">Artefact Store &#8212; local filesystem</text>
  <rect class="sub" x="34" y="600" width="142" height="56"/>
  <text class="p" x="105" y="620">Base model</text>
  <text class="p" x="105" y="633">weights</text>
  <text class="i" x="105" y="648">seven networks</text>
  <rect class="sub" x="184" y="600" width="142" height="56"/>
  <text class="p" x="255" y="620">Meta-learner</text>
  <text class="p" x="255" y="633">coefficients</text>
  <text class="i" x="255" y="648">one per module</text>
  <rect class="sub" x="334" y="600" width="142" height="56"/>
  <text class="p" x="405" y="620">Calibration and</text>
  <text class="p" x="405" y="633">conformal artefacts</text>
  <text class="i" x="405" y="648">brain MRI module only</text>
  <rect class="sub" x="484" y="600" width="142" height="56"/>
  <text class="p" x="555" y="620">Evidence base and</text>
  <text class="p" x="555" y="633">embedding index</text>
  <text class="i" x="555" y="648">32 passages, 17 sources</text>
</svg>
